name: Cardinal CI

on:
  push:
    branches:
      - 'feature/cardinal-*'
  pull_request:
    paths:
      - 'index.html'
      - 'cardinal.html'
      - 'cardinal.css'
      - 'src/cardinal-app.js'
      - 'src/cardinal/**'
      - 'test/cardinal-*.test.mjs'
      - 'package.json'
      - 'CARDINAL_DATA_MODEL.md'
      - '.github/workflows/cardinal-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test
        run: npm test
      - name: Syntax gate
        run: npm run check
